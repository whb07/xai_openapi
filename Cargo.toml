[package]
name = "xai-openapi"
version = "0.1.0"
repository = "https://github.com/whb07/xai_openapi"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Rust types for the xAI API (Grok models)"
keywords = ["xai", "grok", "api", "openapi"]
readme = "README.md"
categories = ["api-bindings", "web-programming", "no-std"]

[lib]
name = "xai_openapi"
path = "src/lib.rs"
doctest = false

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hashbrown = { version = "0.16.1", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
